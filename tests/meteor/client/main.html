<head>
  <title>gclass-anims — Meteor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <!-- client/styles.css is generated by `npm run build:css` (Tailwind CLI).
       Meteor serves everything under client/ from the app root, so this path is
       correct both in development and in the built bundle. -->
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <!-- Note: written as <div></div>, never <div />. This is plain HTML, and the
       parser does not honour self-closing syntax on a div - a <div /> silently
       never closes and swallows the rest of the document into itself. -->
  <div class="gc-bar scroll-progress"></div>
  {{> page}}
</body>
