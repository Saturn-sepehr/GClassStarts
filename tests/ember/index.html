<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>gclass-anims — Ember</title>
    <meta name="description" content="gclass-anims running in an Ember app">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script type="module">
      // The app's own stylesheet is imported from app/app.js rather than
      // linked here: that routes it through Vite, so PostCSS (and therefore
      // Tailwind) actually processes it. Embroider's virtual app.css is a
      // verbatim copy and skips the CSS pipeline.
      import Application from './app/app';
      import environment from './app/config/environment';

      Application.create(environment.APP);
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
